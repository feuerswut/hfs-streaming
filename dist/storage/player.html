<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            width: 90%;
            max-width: 1000px;
        }
        video {
            width: 100%;
            background: #000;
            border-radius: 4px;
            display: block;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            border-radius: 4px;
        }
        .info h2 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .info p {
            font-size: 13px;
            color: #aaa;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="player" controls>
            Your browser does not support MPEG-TS streams.
        </video>
        <div class="info">
            <h2>📺 Live Stream</h2>
            <p id="status">Loading stream URL...</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('player');
        const statusEl = document.getElementById('status');
        
        // Get stream URL from query param or construct it
        const params = new URLSearchParams(window.location.search);
        const streamUrl = params.get('stream') || window.location.pathname.replace(/\/$/, '') + '/stream';
        
        video.src = streamUrl;
        statusEl.textContent = 'Stream: ' + streamUrl;
        
        video.addEventListener('play', function() {
            statusEl.textContent = '🔴 LIVE';
        });
        
        video.addEventListener('pause', function() {
            statusEl.textContent = '⏸ PAUSED';
        });
        
        video.addEventListener('error', function() {
            statusEl.textContent = '❌ Error loading stream';
        });
        
        // Auto play
        video.play().catch(function(e) {
            console.log('Autoplay blocked');
        });
    </script>
</body>
</html>
